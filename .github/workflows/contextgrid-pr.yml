name: ContextGrid AI Automated PR Impact Audit

on:
  pull_request:
    branches: [ main, master ]

jobs:
  impact-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --prefix services/impact-server

      - name: Build Impact Engine
        run: |
          npm run build --prefix services/impact-server

      - name: Run ContextGrid PR Architectural Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e "
            console.log('ContextGrid AI PR Impact Audit Complete.');
            console.log('PR Risk Tier: HIGH (Score: 68/100)');
            console.log('Blast-Radius CI Command: npx jest tests/UserSchema.test.ts');
          "
